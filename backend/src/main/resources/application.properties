server.port=${PORT:8080}
spring.application.name=bikaner-express-backend

# MySQL Database configuration (Supports Local MySQL and Cloud MySQL like Aiven)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/bikaner_express_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8}
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:9058605348}

# JPA / Hibernate for MySQL
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
# Immediately release DB connection back to pool after query execution (Crucial for Cloud MySQL!)
spring.jpa.open-in-view=false

# Tomcat Worker Threads
server.tomcat.threads.max=50
server.tomcat.threads.min-spare=10
server.tomcat.max-connections=1000
server.tomcat.accept-count=100
server.tomcat.connection-timeout=10000

# HikariCP Cloud Connection Pool (Optimized strictly for Aiven Free Tier 20-connection limit)
# Safe pool: 8 max connections ensures zero "Too Many Connections" or connection starvation
spring.datasource.hikari.maximum-pool-size=8
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.max-lifetime=300000
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.leak-detection-threshold=10000

# Groq Cloud Ultra-Fast LLM API Configuration
groq.api.key=${GROQ_API_KEY:}
groq.model=qwen/qwen3.8-27b
