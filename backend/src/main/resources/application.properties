server.port=8080
spring.application.name=bikaner-express-backend

# MySQL Database configuration
spring.datasource.url=jdbc:mysql://localhost:3306/bikaner_express_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=9058605348

# JPA / Hibernate for MySQL
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# High Concurrency & Crash Protection (handles 200+ concurrent requests effortlessly)
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=25
server.tomcat.max-connections=10000
server.tomcat.accept-count=200
server.connection-timeout=20000

# HikariCP Connection Pool optimizations for concurrent transactions
spring.datasource.hikari.maximum-pool-size=50
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000

# Groq Cloud Ultra-Fast LLM API Configuration
groq.api.key=${GROQ_API_KEY:}
groq.model=qwen/qwen3.8-27b
